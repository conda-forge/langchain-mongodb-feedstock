schema_version: 1

context:
  name: langchain-mongodb
  version: "0.12.1"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_mongodb-${{ version }}.tar.gz
  sha256: dd157ba1d1ca993dc8d34e8433869ae67bdc02249417ead0ce193be00baaca2a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - lark <2.0.0,>=1.1.9
    - python >=${{ python_min }}
    - pymongo >=4.6.1
    - langchain-core >=1.2.5
    - numpy >=1.26
    - langchain >=1.0
    - langchain-text-splitters >=1.0
    - pymongo-search-utils >=0.2.1
    - langchain-classic >=1.0
tests:
  - python:
      imports:
        - langchain_mongodb
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting MongoDB and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain

extra:
  recipe-maintainers:
    - jan-janssen
